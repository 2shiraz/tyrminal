name: Set up toolchains
description: Node, pnpm, Rust (from rust-toolchain.toml), Linux WebKitGTK build deps and dependency caches.
inputs:
  cache-key:
    description: Extra key for the Rust cache (e.g. the job name)
    required: false
    default: default
runs:
  using: composite
  steps:
    - name: Linux system packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
          libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf file xvfb xauth \
          dbus dbus-x11 gnome-keyring openssh-client openssh-server
    - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
    - name: Rust toolchain (pinned by rust-toolchain.toml)
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install
    - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      with:
        key: ${{ inputs.cache-key }}
        cache-targets: "true"
    - name: Install JavaScript dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
