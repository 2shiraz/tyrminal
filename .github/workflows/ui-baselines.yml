# Temporary: re-records the visual baselines in CI's pinned Playwright image and commits them to
# this branch. Removed again before merge.
name: UI baselines

on:
  push:
    branches: [claude/blissful-brown-7h9l18]
    paths: [".github/workflows/ui-baselines.yml"]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tyrminal/desktop build
      - name: Record visual baselines
        working-directory: tests/ui
        run: ./node_modules/.bin/playwright test -c playwright.config.ts visual.spec.ts --update-snapshots=all
      - name: Commit them
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/__screenshots__
          git commit -m "Visual baselines recorded in CI's Playwright image" || echo "no changes"
          git push origin HEAD:${{ github.ref_name }}
