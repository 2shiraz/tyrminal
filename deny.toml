# Dependency policy (BUILD_SPEC §3.1, §9.7). `cargo deny check` runs in the Security workflow.
[graph]
all-features = false
no-default-features = false
# Release scope: desktop targets only. Mobile targets (Phase 14) pull in more of Tauri's graph,
# including an HTTP client, and are re-evaluated when they become a target.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, notice) is reported; exceptions
# must be listed here with a reason and are reviewed at each release.
version = 2
yanked = "deny"
ignore = [
  # Marvin attack: the `rsa` crate's private-key operations are not constant time. russh uses it
  # for RSA client keys. No fixed release exists. Exposure: signing with an imported RSA key; a
  # server would need precise timing of many signatures. Mitigation: Tyrminal generates Ed25519
  # keys and recommends them; tracked in docs/decisions/0003-ci-supply-chain-and-lab.md.
  { id = "RUSTSEC-2023-0071", reason = "no fixed rsa release; RSA client keys only; Ed25519 is the default" },
  # proc-macro-error is unmaintained; a build-time proc-macro reached only through gtk-rs on Linux.
  { id = "RUSTSEC-2024-0370", reason = "build-time only (gtk-rs macros on Linux); no runtime code" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Compatible with distributing the application under Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# No HTTP client may enter the application graph in local mode (INV-01); check-release.mjs also
# inspects the release feature graph.
deny = [
  { crate = "reqwest", reason = "no vendor network client in local mode" },
  { crate = "openssl-sys", reason = "the SSH and vault stacks use aws-lc-rs / RustCrypto" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
