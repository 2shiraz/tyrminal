[package]
name = "tyrminal-desktop"
description = "Tyrminal desktop application (Tauri adapter)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "tyrminal_desktop"
path = "src/lib.rs"

[[bin]]
name = "tyrminal"
path = "src/main.rs"

[features]
# Embeds a WebDriver automation server for native end-to-end tests. NEVER enable in a release:
# it lets any local process drive the application. `scripts/check-release.mjs` verifies that
# release binaries do not contain it.
e2e = ["dep:tauri-plugin-wdio-webdriver"]
# The in-app updater (ADR 0013). Enabled only by the release workflow, and only when the update
# signing key is configured; `scripts/check-release.mjs` keeps it out of the default graph.
updater = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
# Opaque tokens for local file grants (already used by tyrminal-core).
getrandom = "0.4.3"
serde = { version = "1", features = ["derive"] }
# Clears a picked private-key file from memory (already used by tyrminal-core; agent D, ADR 0006).
zeroize = "1.9.1"
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }
# Hands a validated http(s) URL to the OS default browser (link opener, TRM link policy).
open = "=5.4.4"
# Native open/save dialogs for backup files and SFTP transfers, driven from Rust only: the renderer gets no dialog
# permission and never supplies a path (ADR 0003).
tauri-plugin-dialog = "=2.8.2"
# Command-finished desktop notifications (P-23), sent from Rust only: the renderer gets no notification
# permission and supplies no text; the core builds it from validated fields (ADR 0011).
tauri-plugin-notification = "=2.6.0"
# Signed in-app updates (UX-05, ADR 0013), driven from Rust only: the renderer gets no updater
# permission. Optional: only release builds made with the update signing key enable the `updater`
# feature, so every other build has no HTTP client at all. Verifies each artifact against the public
# key built into the release. rustls only (no system TLS), no proxy autodetection.
tauri-plugin-updater = { version = "=2.13.3", default-features = false, features = ["rustls-tls", "zip"], optional = true }
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time"] }
tyrminal-core = { path = "../../../crates/core" }

[dev-dependencies]
# Builds Tauri configurations in the updater tests (already in the graph through tauri).
serde_json = "1"
