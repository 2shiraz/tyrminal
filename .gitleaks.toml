# Secret scanning policy. Extends the default gitleaks rules. Allowlisted paths hold only public
# test vectors or generated contract types, never credentials.
[extend]
useDefault = true

[allowlist]
description = "Public known-answer vectors and documentation examples"
paths = [
  '''tests/fixtures/vault-vectors/vectors\.json''',
  '''tests/fixtures/vault-vectors/backup\.json''',
  '''docs/crypto-format\.md''',
  # A throwaway DSA key that authorizes nothing (tests/fixtures/review/README.md).
  '''tests/fixtures/review/dsa-throwaway\.key''',
  # A made-up updater public key ("untrusted comment: minisign public key ABCDEF", base64).
  '''scripts/ci/updater\.test\.mjs''',
]
# Algorithm names in prose match the generic-api-key entropy rule.
regexes = [
  '''XChaCha20-Poly1305''',
]
