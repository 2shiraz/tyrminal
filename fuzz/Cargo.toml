# Fuzz targets for untrusted-input decoders (BUILD_SPEC §9.1). Not a workspace member: it needs a
# nightly toolchain and libFuzzer. Run with `cargo +nightly fuzz run <target>` from this directory.
[package]
name = "tyrminal-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.10"
tyrminal-vault = { path = "../crates/vault" }

[workspace]

[[bin]]
name = "vault_header_decode"
path = "fuzz_targets/vault_header_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recovery_key_parse"
path = "fuzz_targets/recovery_key_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "backup_decode"
path = "fuzz_targets/backup_decode.rs"
test = false
doc = false
