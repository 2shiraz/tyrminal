[package]
name = "tyrminal-vault"
description = "Tyrminal vault key hierarchy, key slots and record envelopes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
hex = "0.4.3"
proptest = "1.12.0"
serde_json = "1"
