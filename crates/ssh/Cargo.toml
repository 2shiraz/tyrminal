[package]
name = "tyrminal-ssh"
description = "Tyrminal SSH adapter: host trust before authentication, auth, PTY channels"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
russh = "0.64.1"
thiserror = "2.0.21"
tokio = { version = "1.53", features = ["net", "time", "sync", "rt", "macros", "io-util"] }
zeroize = "1.9.1"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1.53", features = ["full"] }
zeroize = "1.9.1"
