[package]
name = "tyrminal-pty"
description = "Tyrminal local terminal: PTY/ConPTY processes with structured argv"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
portable-pty = "0.9.0"
thiserror = "2.0.21"
tokio = { version = "1.53", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
