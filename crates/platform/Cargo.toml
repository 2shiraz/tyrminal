[package]
name = "tyrminal-platform"
description = "Tyrminal OS service adapters: secret store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
keyring-core = "1.0.0"
thiserror = "2.0.21"
zeroize = "1.9.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["rt-async-io-crypto-rust"] }
# Screen-lock signals (already in the tree through the Secret Service store; ADR 0003).
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
getrandom = "0.4.3"
