[package]
name = "tyrminal-core"
description = "Tyrminal application services: vault lifecycle, records and sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
getrandom = "0.4.3"
quick-xml = { version = "0.42.0", default-features = false }
if-addrs = "0.15"
mdns-sd = { version = "0.21.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Legacy terminal encodings (TRM-05). ADR 0003 addendum.
encoding_rs = "0.8.42"
# Serial connections (CON-06); no libudev: ports are opened by path. ADR 0003 addendum.
serialport = { version = "4.10.1", default-features = false }
# compromised-password check (SEC-11): the range query uses SHA-1 (ADR 0003)
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53", features = ["rt", "sync", "time", "macros", "fs", "io-util", "net"] }
tyrminal-contracts = { path = "../contracts" }
tyrminal-platform = { path = "../platform" }
tyrminal-pty = { path = "../pty" }
tyrminal-ssh = { path = "../ssh" }
tyrminal-storage = { path = "../storage" }
tyrminal-vault = { path = "../vault" }
zeroize = { version = "1.9.1", features = ["serde"] }

[dev-dependencies]
sha2 = "0.11.0"
rusqlite = "0.40.2"
tempfile = "3"
tokio = { version = "1.53", features = ["full"] }
